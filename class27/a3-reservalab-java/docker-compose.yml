# docker compose up                      -> roda a demonstração
# docker compose run --rm testes         -> roda a suíte de testes
services:
  demo:
    build: .
    image: reservalab-java:1.0.0

  testes:
    build: .
    image: reservalab-java:1.0.0
    command: ["mvn", "-B", "-o", "test"]
    profiles: ["testes"]
