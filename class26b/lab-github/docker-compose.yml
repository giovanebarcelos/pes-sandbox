# =============================================================================
# PES26B - Laboratorio GitHub Actions: Boletim API + Traefik + runner self-hosted
# =============================================================================
# Aula 26B (Projeto e Engenharia de Software). Tutorial completo em
# PES26B-Tutorial-GitHubActions.md (mesma pasta).
#
# O CI roda no GitHub (runners ubuntu-latest). Este compose e' o seu
# "servidor de producao" local:
#
#   http://boletim.localhost          Boletim API em Java
#   http://boletim-python.localhost   Boletim API em Python
#   http://traefik.localhost          painel do Traefik
#   http://cobertura.localhost        relatorios de cobertura (JaCoCo e coverage.py)
#
# e, com --profile runner, o RUNNER SELF-HOSTED que executa o job de deploy
# do release.yml aqui na sua maquina.
#
# USO
#   cp .env.example .env
#   docker compose up -d --build                    # APIs com imagem local
#   docker compose --profile runner up -d --build   # + runner (Etapa 8)
#   docker compose --profile cobertura up -d        # + relatorios de cobertura
#
#   O deploy do release.yml troca as imagens locais pelas do GHCR:
#   IMAGEM_JAVA / IMAGEM_PYTHON / APP_VERSION vem do workflow.
#
#   docker compose --profile runner down            # para tudo
# =============================================================================
name: pes26b

services:

  traefik:
    container_name: pes26b_traefik
    # v3.6+ e' obrigatorio no Docker Engine 29+.
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=pes26b_rede
      - --entrypoints.web.address=:80
      - --api.dashboard=true
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.painel.rule=Host(`traefik.localhost`)
      - traefik.http.routers.painel.entrypoints=web
      - traefik.http.routers.painel.service=api@internal
    networks:
      - rede
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Boletim API - JAVA (principal)
  # ---------------------------------------------------------------------------
  boletim-java:
    container_name: pes26b-boletim-java
    image: ${IMAGEM_JAVA:-pes26b/boletim-java:local}
    build: ./java
    environment:
      APP_VERSION: ${APP_VERSION:-local}
      INSTITUICAO: ${INSTITUICAO:-ambiente local}
      TOKEN_ADMIN: ${TOKEN_ADMIN:-}
    labels:
      - traefik.enable=true
      - traefik.http.routers.boletim-java.rule=Host(`boletim.localhost`)
      - traefik.http.routers.boletim-java.entrypoints=web
      - traefik.http.services.boletim-java.loadbalancer.server.port=8080
    networks:
      - rede
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Boletim API - PYTHON (secundaria; mesma API, mesmos defeitos)
  # ---------------------------------------------------------------------------
  boletim-python:
    container_name: pes26b-boletim-python
    image: ${IMAGEM_PYTHON:-pes26b/boletim-python:local}
    build: ./python
    environment:
      APP_VERSION: ${APP_VERSION:-local}
      INSTITUICAO: ${INSTITUICAO:-ambiente local}
      TOKEN_ADMIN: ${TOKEN_ADMIN:-}
    labels:
      - traefik.enable=true
      - traefik.http.routers.boletim-python.rule=Host(`boletim-python.localhost`)
      - traefik.http.routers.boletim-python.entrypoints=web
      - traefik.http.services.boletim-python.loadbalancer.server.port=5000
    networks:
      - rede
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Relatorios de cobertura (so' com --profile cobertura): serve o HTML do JaCoCo
  # (java/target/site/jacoco) e do coverage.py (python/relatorio-cobertura)
  # gerados por "mvn verify" e pelo pytest NA SUA MAQUINA. Rode os testes antes:
  # se a pasta nao existir, o Docker a cria como root e atrapalha o Maven.
  # ---------------------------------------------------------------------------
  cobertura:
    container_name: pes26b_cobertura
    image: nginx:1.29-alpine
    profiles: ["cobertura"]
    volumes:
      - ./cobertura/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./cobertura/index.htm:/usr/share/nginx/html/index.htm:ro
      - ./java/target/site/jacoco:/usr/share/nginx/html/java:ro
      - ./python/relatorio-cobertura:/usr/share/nginx/html/python:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.cobertura.rule=Host(`cobertura.localhost`)
      - traefik.http.routers.cobertura.entrypoints=web
      - traefik.http.services.cobertura.loadbalancer.server.port=80
    networks:
      - rede
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Runner SELF-HOSTED do GitHub Actions (so' com --profile runner)
  # Registra-se no SEU repositorio com REPO_URL e RUNNER_TOKEN do .env e
  # executa os jobs com "runs-on: [self-hosted, pes26b]".
  # ---------------------------------------------------------------------------
  runner:
    container_name: pes26b_runner
    build: ./runner
    profiles: ["runner"]
    environment:
      REPO_URL: ${REPO_URL:-}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_NAME: pes26b-runner
      RUNNER_LABELS: pes26b
    volumes:
      # O job de deploy usa o Docker da maquina para trocar os containers.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - rede
    restart: unless-stopped

networks:
  rede:
    name: pes26b_rede
