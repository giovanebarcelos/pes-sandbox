# =============================================================================
# UA5 (Aulas 18-22), versão Java — ALTERNATIVA com Docker
# O modo PRINCIPAL é local, só com o JDK 17+ (veja README.md).
# Use isto se a sua máquina tem Docker mas não tem JDK, ou para conferir no Java 17.
#
# Não há build: todos os serviços usam a imagem oficial eclipse-temurin:17-jdk
# e enxergam esta pasta em /workspace (o que você edita aparece no contêiner).
#
# Por padrão roda a pasta "solucao". Para rodar a SUA versão:
#   Linux/macOS:  PASTA=meu docker compose run --rm aula20
#   PowerShell:   $env:PASTA="meu"; docker compose run --rm aula20
#
#   docker compose run --rm verificar                       testes de todas as aulas
#   docker compose run --rm aula18                          testes da Aula 18
#   docker compose run --rm aula18 java /workspace/ferramentas/Rodar.java locadora.Main
#   docker compose up aula19-web                            http://localhost:8019
#   docker compose up aula20-web                            http://localhost:8020 (adaptador arquivo)
#   docker compose run --rm aula21 java /workspace/ferramentas/Rodar.java locadora.Main
#   docker compose --profile aula22 up                      frota, locações e notificação
#   docker compose run --rm aula22-demo                     cliente de demonstração
#   docker compose down -v                                  para tudo e apaga os dados
# =============================================================================

x-java: &java
  image: eclipse-temurin:17-jdk
  volumes:
    - .:/workspace
  environment:
    LOCADORA_ARQUIVO: /tmp/frota.csv

services:
  verificar:
    <<: *java
    working_dir: /workspace
    command: java ferramentas/Verificar.java
    profiles: ["ferramentas"]

  aula18:
    <<: *java
    working_dir: /workspace/aula18/${PASTA:-solucao}
    command: java /workspace/ferramentas/Rodar.java testes
    profiles: ["aula18"]

  aula19:
    <<: *java
    working_dir: /workspace/aula19/${PASTA:-solucao}
    command: java /workspace/ferramentas/Rodar.java testes
    profiles: ["aula19"]

  aula19-web:
    <<: *java
    working_dir: /workspace/aula19/${PASTA:-solucao}
    command: java /workspace/ferramentas/Rodar.java locadora.apresentacao.ServidorWeb
    environment:
      PORT: "8019"
    ports: ["8019:8019"]
    profiles: ["aula19"]

  aula20:
    <<: *java
    working_dir: /workspace/aula20/${PASTA:-solucao}
    command: java /workspace/ferramentas/Rodar.java testes
    profiles: ["aula20"]

  aula20-web:
    <<: *java
    working_dir: /workspace/aula20/${PASTA:-solucao}
    command: java /workspace/ferramentas/Rodar.java locadora.adaptadores.entrada.ServidorWeb
    environment:
      PORT: "8020"
      LOCADORA_REPO: arquivo
      LOCADORA_DADOS: /dados
    volumes:
      - .:/workspace
      - dados20:/dados
    ports: ["8020:8020"]
    profiles: ["aula20"]

  aula21:
    <<: *java
    working_dir: /workspace/aula21/${PASTA:-solucao}
    command: java /workspace/ferramentas/Rodar.java testes
    profiles: ["aula21"]

  aula22:
    <<: *java
    working_dir: /workspace/aula22/${PASTA:-solucao}
    command: java /workspace/ferramentas/Rodar.java testes
    profiles: ["aula22-testes"]

  # ---- Aula 22: três microsserviços, cada um no seu contêiner ----
  frota:
    <<: *java
    working_dir: /workspace/aula22/${PASTA:-solucao}
    command: java /workspace/ferramentas/Rodar.java servicos.FrotaServico
    environment:
      PORTA: "8001"
    ports: ["8001:8001"]
    profiles: ["aula22"]

  notificacao:
    <<: *java
    working_dir: /workspace/aula22/${PASTA:-solucao}
    command: java /workspace/ferramentas/Rodar.java servicos.NotificacaoServico
    environment:
      PORTA: "8003"
    ports: ["8003:8003"]
    profiles: ["aula22"]

  locacoes:
    <<: *java
    working_dir: /workspace/aula22/${PASTA:-solucao}
    command: java /workspace/ferramentas/Rodar.java servicos.LocacoesServico
    environment:
      PORTA: "8002"
      FROTA_URL: http://frota:8001
      NOTIFICACAO_URL: http://notificacao:8003
      LOCADORA_EVENTOS: /dados/eventos.jsonl
    volumes:
      - .:/workspace
      - dados22:/dados
    ports: ["8002:8002"]
    depends_on: [frota, notificacao]
    profiles: ["aula22"]

  aula22-demo:
    <<: *java
    working_dir: /workspace/aula22/${PASTA:-solucao}
    command: java /workspace/ferramentas/Rodar.java servicos.DemoCliente
    environment:
      FROTA_URL: http://frota:8001
      LOCACOES_URL: http://locacoes:8002
      NOTIFICACAO_URL: http://notificacao:8003
    profiles: ["aula22-demo"]

volumes:
  dados20:
  dados22:
